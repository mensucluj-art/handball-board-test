<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f14">
  <title>Handball Rotation Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div><small>U CLUJ · STAFF TOOL</small><h1>Handball Rotation Board</h1></div>
    <div class="controls">
      <button id="start">START</button><b id="clock">00:00</b>
      <button id="pause">PAUZĂ</button><button id="undo">UNDO</button><button id="reset" class="danger">RESET</button>
    </div>
  </header>
  <section class="phase">
    <span>FAZA ACTIVĂ</span>
    <button id="attackMode" class="active">ATAC</button>
    <button id="defenceMode">APĂRARE</button>
    <em>Ambele formule rămân permanent vizibile.</em>
  </section>
  <main>
    <section class="board">
      <div class="court">
        <div class="label top">ATAC</div><div class="label bottom">APĂRARE</div>
        <div class="mid"></div><div class="goal gt"></div><div class="goal gb"></div>
        <div class="arc at"></div><div class="arc ab"></div>
        <div id="attackLayer"></div><div id="defenceLayer"></div>
      </div>
    </section>
    <aside>
      <div class="asideHead"><div><small>LOT</small><h2>Rezerve</h2></div></div>
      <div id="bench"></div>
    </aside>
  </main>
</div>
<div id="backdrop" class="hidden"><div class="modal"><button id="close">×</button><div id="modal"></div></div></div>
<script src="app.js"></script>
</body>
</html>
